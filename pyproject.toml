[project]
name = "mailysoft-system-api"
version = "3.0.0"
description = "Servicio REST de MailySoft (suscripciones)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.143",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "tzdata>=2026.5",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    # Auto-applied by `pytest_collection_modifyitems` (tests/conftest.py) to every test that needs
    # a real, migrated PostgreSQL. Excluded by default (Principle V): `uv run pytest` runs only the
    # unit tests; `uv run pytest -m ""` runs everything (the gate before merging into `main`).
    "slow: necesita PostgreSQL real migrado (integración o contrato)",
]
addopts = "-m 'not slow'"
