[project]
name = "mailysoft-system-api"
version = "0.1.0"
description = "Servicio REST de MailySoft (suscripciones)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.143",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "slow: pruebas lentas",
]
addopts = "-m 'not slow'"
