# [spec 010-cobro-real-suscripciones] Contrato objetivo de las 3 operaciones nuevas. Se suma al
# esquema que ya publica la aplicación; no reemplaza nada. El esquema real (/openapi.json) se
# compara a mano en tests/contract/test_clinic_subscriptions_openapi.py (sin PyYAML).
openapi: 3.1.0
info:
  title: MailySoft System API — Cobro de suscripciones de clínica
  version: 2.0.0
  description: |
    Cobra, contra Mercado Pago a través de `mailySoft-pagos`, una suscripción de clínica cuya
    asignación (clínica, plan, ciclo) **no vive aquí**: la decide el futuro microservicio Clínicas,
    consultado en el momento de cobrar. Este servicio solo ejecuta el cobro y guarda su historial.

    - **Dos audiencias**: `clinic_subscriptions:read` (listar/consultar el historial) lo tiene quien
      administra la plataforma. `clinic_subscriptions:charge` (disparar el cobro) lo tiene una
      persona de la propia clínica: se comprueba con `GET /authorization/me` (no con `/check`) para
      conocer su `tenant_id` y compararlo con el que reporta Clínicas.
    - **Dinero**: el cobro que se envía a Pagos es en centavos (entero); el catálogo de planes sigue
      en pesos con dos decimales.
    - **Historial**: cada intento de cobro (rechazados incluidos) queda como una fila propia.
servers:
  - url: http://localhost:8010
    description: Entorno local (Docker Compose o uvicorn)
tags:
  - name: clinic-subscriptions
    description: Cobro, contra mailySoft-pagos, de una suscripción de clínica que decide Clínicas.
paths:
  /api/v1/clinic-subscriptions/{clinic_subscription_id}/charges:
    post:
      tags: [clinic-subscriptions]
      operationId: charge_clinic_subscription
      summary: Disparar el cobro de la suscripción de una clínica
      description: |
        Consulta a Clínicas los datos de `clinic_subscription_id` (`tenant_id`, `subscription_id`,
        `billing_cycle`); solo una persona de la **misma organización** (FR-009, FR-026): si no
        coincide (o Clínicas dice que no existe), responde 404, no 403. Llama a
        `POST /api/v1/payments` de mailySoft-pagos reenviando ese mismo token.

        **Permiso requerido**: `clinic_subscriptions:charge` (propio de un rol de Clínica).
      security: [{BearerAuth: []}]
      x-required-permission: clinic_subscriptions:charge
      parameters:
        - {name: clinic_subscription_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClinicSubscriptionChargeCreate'}
            examples:
              periodo: {value: {period: '2026-12-01'}}
      responses:
        '201':
          description: Cobro disparado (o el ya existente del mismo periodo, por idempotencia).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClinicSubscriptionChargeRead'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ChargeForbidden'}
        '404': {$ref: '#/components/responses/ClinicSubscriptionNotFound'}
        '409': {$ref: '#/components/responses/ChargeConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    get:
      tags: [clinic-subscriptions]
      operationId: list_clinic_subscription_charges
      summary: Listar el historial de cobros de una suscripción de clínica (paginado)
      description: |
        **Permiso requerido**: `clinic_subscriptions:read`.
      security: [{BearerAuth: []}]
      x-required-permission: clinic_subscriptions:read
      parameters:
        - {name: clinic_subscription_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Página del historial de cobros, del más reciente al más antiguo.
          headers: {X-Total-Count: {schema: {type: integer, minimum: 0}}}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ClinicSubscriptionChargeRead'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/AuthorizationUnavailable'}
  /api/v1/clinic-subscriptions/{clinic_subscription_id}/charges/{charge_id}:
    get:
      tags: [clinic-subscriptions]
      operationId: get_clinic_subscription_charge
      summary: Consultar un cobro del historial
      description: |
        Si está `pending`, se sincroniza con Pagos antes de responder (historia 2).

        **Permiso requerido**: `clinic_subscriptions:read`.
      security: [{BearerAuth: []}]
      x-required-permission: clinic_subscriptions:read
      parameters:
        - {name: clinic_subscription_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: charge_id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: El cobro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClinicSubscriptionChargeRead'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ClinicSubscriptionChargeNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/AuthorizationUnavailable'}
components:
  responses:
    Unauthorized: {description: Sin token o token no válido., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Sin el permiso., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ChargeForbidden: {description: Sin el permiso, con el cambio de contraseña pendiente, o mailySoft-pagos no autorizó el cobro., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    AuthorizationUnavailable: {description: No se pudo comprobar el acceso., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    DependencyUnavailable: {description: Clínicas o mailySoft-pagos no respondieron; no se disparó ningún cobro., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ValidationError: {description: Datos de la solicitud no válidos., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ClinicSubscriptionNotFound: {description: Clínicas no reconoce ese identificador, está cancelada, o es de otra organización., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ClinicSubscriptionChargeNotFound: {description: El cobro no existe., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ChargeConflict: {description: Ya hay un cobro aprobado para ese periodo, el plan ya no está Activo, o hay un conflicto de idempotencia., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer, description: Token de Auth0; este servicio no lo verifica.}
  schemas:
    PaymentStatus:
      type: string
      enum: [pending, approved, rejected, cancelled, partially_refunded, refunded]
    ClinicSubscriptionChargeCreate:
      type: object
      required: [period]
      properties:
        period: {type: string, format: date, description: Periodo que se cobra (lo decide quien dispara el cobro).}
    ClinicSubscriptionChargeRead:
      type: object
      required: [id, clinic_subscription_id, tenant_id, period, amount, currency, payment_id, payment_status, checkout_url, created_at, updated_at]
      properties:
        id: {type: integer}
        clinic_subscription_id: {type: string, format: uuid, description: Identificador opaco de Clínicas.}
        tenant_id: {type: string, format: uuid}
        period: {type: string, format: date}
        amount: {type: integer, description: Centavos.}
        currency: {const: MXN, type: string}
        payment_id: {type: string, format: uuid}
        payment_status: {$ref: '#/components/schemas/PaymentStatus'}
        checkout_url: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ErrorCode:
      type: string
      enum: [unauthenticated, token_expired, invalid_token, permission_denied, password_change_required, authorization_unavailable, clinics_check_unavailable, clinic_subscription_not_found, clinic_subscription_charge_not_found, clinic_subscription_plan_not_active, clinic_subscription_charge_already_approved, payment_not_authorized, clinic_subscription_charge_conflict, payments_unavailable, validation_error, internal_error]
    FieldError: {type: object, required: [field, message], properties: {field: {type: string}, message: {type: string}}}
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string}
        errors: {type: array, items: {$ref: '#/components/schemas/FieldError'}}
