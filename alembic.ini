[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# No se define `sqlalchemy.url`: alembic/env.py la toma de DATABASE_URL (variable de
# entorno o `.env`), de modo que no se versiona ninguna credencial.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
